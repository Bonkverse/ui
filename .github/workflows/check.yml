name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contrast (every token pair, all three themes)
        run: node scripts/contrast.mjs
      - name: Version strings match package.json
        run: node scripts/check-version.mjs
